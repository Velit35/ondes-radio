<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9d0c2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ondes">
<title>Ondes Radio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preload" href="AzeretMono-SemiBold.otf" as="font" type="font/otf" crossorigin>
<style>
/* Même graphisme qu'Ondes (écran du lecteur et télécommande web, version 1.15) :
   LCD monochrome façon iPod, police Azeret Mono SemiBold (licence libre SIL OFL). */
@font-face {
  font-family: "Azeret Mono";
  src: url("AzeretMono-SemiBold.otf") format("opentype");
  font-weight: 100 900; font-style: normal; font-display: swap;
}
:root {
  --bg: #c9d0c2;
  --ink: #1c211e;
  --mid: #6e766c;
  --shade: #b6bead;
  --font: "Azeret Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  --bar-h: 54px;
  --row-h: 66px;
  --row-font: 19px;
  --pad: 18px;
}
@media (min-width: 700px) {
  :root { --bar-h: 60px; --row-h: 70px; --row-font: 21px; --pad: 26px; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-synthesis: none; font-weight: 700;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; overflow: hidden;
}
body::after { /* trame LCD, comme sur l'écran du lecteur */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
  background: repeating-linear-gradient(0deg, rgba(28,33,30,.04) 0 1px, transparent 1px 3px);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- mise en page ---------- */
.app {
  height: 100vh; height: 100dvh; display: flex;
  max-width: 1440px; margin: 0 auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.main-pane { flex: 1 1 auto; }
.side-pane { display: none; }
@media (min-width: 960px) {
  .side-pane { display: flex; flex: 0 0 min(42%, 520px); border-left: 3px solid var(--ink); }
}
@media (min-width: 1440px) {
  .app { border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); }
}

/* ---------- barre de titre ---------- */
.bar {
  flex: none; height: var(--bar-h);
  display: grid; grid-template-columns: var(--bar-h) 1fr var(--bar-h); align-items: center;
  border-bottom: 3px solid var(--ink);
}
.bar h1, .bar h2 {
  margin: 0; font-size: calc(var(--row-font) - 1px); font-weight: 700; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* flèche « retour » ↖ : même dessin que l'écran d'Ondes */
.back { height: 100%; display: grid; place-items: center start; padding: 0 0 0 calc((var(--bar-h) - 26.1px) / 2); }
.back.off { visibility: hidden; }
.back svg { width: 21px; height: 21px; display: block; fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
.state { display: grid; place-items: center; height: 100%; }
.state svg { width: 21px; height: 21px; fill: var(--ink); }

.content { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
body.with-mini #listBox { padding-bottom: 76px; }

/* ---------- liste des radios ---------- */
.row {
  display: flex; align-items: center; gap: 12px;
  height: var(--row-h); padding: 0 calc(var(--pad) - 6px) 0 var(--pad);
  font-size: var(--row-font); white-space: nowrap; cursor: pointer;
}
.row .lbl { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row .label, .row .sub { overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 13px; color: var(--mid); }
.row .mark { flex: none; width: 18px; height: 18px; fill: currentColor; }
.row.busy .mark { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.row.press { background: var(--ink); color: var(--bg); }
.row.press .sub { color: var(--shade); }
@media (hover: hover) {
  .row:hover { background: var(--ink); color: var(--bg); }
  .row:hover .sub { color: var(--shade); }
}
.empty { padding: 36px var(--pad); text-align: center; color: var(--mid); font-size: calc(var(--row-font) - 3px); line-height: 1.45; }

/* ---------- pochettes (niveaux de gris dans les teintes de l'écran) ---------- */
.thumb {
  flex: none; width: 44px; height: 44px; margin-right: 4px;
  background: #bac2b3; box-shadow: 0 0 0 1px var(--ink); overflow: hidden;
}
.thumb img, .cover img { width: 100%; height: 100%; display: block; object-fit: cover; }
img.gray { filter: grayscale(1) contrast(1.1); }

/* ---------- en lecture ---------- */
.now {
  min-height: 100%; display: flex; flex-direction: column;
  padding: 14px var(--pad) calc(18px + env(safe-area-inset-bottom));
  max-width: 760px; margin: 0 auto;
}
.now .coverwrap { flex: none; align-self: center; width: min(300px, 62vw, 34vh); margin: 6px auto 0; }
.now .cover {
  position: relative; width: 100%; aspect-ratio: 1; margin: 0 0 4px;
  background: #bac2b3; box-shadow: 0 0 0 3px var(--ink);
  display: grid; place-items: center;
}
.now .cover img { position: absolute; inset: 0; }
.now .cover .ph { position: absolute; inset: 0; display: grid; place-items: center; }
.now .cover .ph svg { width: 34%; height: auto; fill: var(--ink); }
.now .cover.has .ph { display: none; }
.now .side { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
.now .meta {
  flex: 1 1 auto; min-height: 150px;
  display: flex; flex-direction: column; text-align: center; gap: 8px;
}
.now .side .meta { min-height: 110px; }
.now .meta .gap { flex: 1 1 0; display: block; }
.now .meta .gap.end { flex-grow: 2; }
.now .kind { font-size: 15px; color: var(--mid); margin-bottom: -2px; }
.now .t { font-size: clamp(24px, 6vw, 34px); overflow: hidden; white-space: nowrap; }
.now .t.idle { color: var(--mid); font-size: clamp(19px, 4.5vw, 24px); }
.now .t span { display: inline-block; }
.now .t.scroll span { padding-left: 100%; animation: marquee var(--dur, 12s) linear infinite; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }
/* le morceau en cours : sur deux lignes au plus, pour qu'on puisse le lire en entier */
.now .a { font-size: clamp(18px, 4.4vw, 24px); line-height: 1.25; max-height: 2.5em; overflow: hidden; overflow-wrap: anywhere; }
.now .al { font-size: clamp(15px, 3.6vw, 18px); color: var(--mid); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.now .a:empty, .now .al:empty, .now .kind:empty { display: none; }
.live { text-align: center; font-size: 15px; color: var(--mid); min-height: 49px; padding-top: 12px; font-variant-numeric: tabular-nums; }
.live .why { font-size: 13px; line-height: 1.4; margin-top: 6px; }
.live.busy .st { animation: blink 1s steps(2, start) infinite; }

.ctrls { display: flex; justify-content: space-around; align-items: center; margin-top: 22px; }
.ctrls button { width: 33%; height: 68px; display: grid; place-items: center; border-radius: 10px; }
.ctrls button svg { width: auto; height: 30px; fill: var(--ink); display: block; }
.ctrls button:disabled { opacity: .3; cursor: default; }
.ctrls button:not(:disabled):active { background: var(--ink); }
.ctrls button:not(:disabled):active svg { fill: var(--bg); }
@media (hover: hover) { .ctrls button:not(:disabled):hover { background: var(--shade); } }

/* écran large et peu haut (téléphone ou tablette à l'horizontale) : pochette à gauche */
@media (min-width: 640px) and (max-width: 959px) and (max-height: 700px) {
  .now { flex-direction: row; gap: 28px; align-items: stretch; max-width: none; }
  .now .coverwrap { width: min(300px, 40vw, calc(100dvh - var(--bar-h) - 48px)); margin: 4px 0; align-self: center; }
  .now .meta, .now .side .meta { min-height: 0; }
  .ctrls { margin-top: 8px; }
}

/* ---------- mini-lecteur (petits écrans, sur la liste) ---------- */
.mini {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; align-items: center; gap: 4px;
  min-height: 68px; padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
  background: var(--bg); border-top: 3px solid var(--ink); cursor: pointer;
}
.mini-text { flex: 1 1 auto; min-width: 0; }
.mini-t { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-a { font-size: 13px; color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; font-variant-numeric: tabular-nums; }
.mini button { flex: none; width: 50px; height: 50px; display: grid; place-items: center; border-radius: 8px; }
.mini button svg { width: auto; height: 20px; fill: var(--ink); display: block; }
.mini button:disabled { opacity: .3; }
.mini button:not(:disabled):active { background: var(--ink); }
.mini button:not(:disabled):active svg { fill: var(--bg); }
</style>
</head>
<body>
<div class="app">
  <section class="pane main-pane">
    <header class="bar">
      <button class="back off" id="back" aria-label="Retour"><svg viewBox="0 0 25 25"><path d="M22.81 2.19L2.19 2.19L2.19 22.81" stroke-width="4.38"/><path d="M2.79 2.79L21.48 21.48" stroke-width="5.45"/></svg></button>
      <h1 id="title">Ondes</h1>
      <button type="button" class="state" id="state" aria-label="En lecture"></button>
    </header>
    <div class="content" id="listBox"><div class="empty">Chargement…</div></div>
    <div class="content" id="nowBox" hidden></div>
  </section>
  <aside class="pane side-pane" aria-label="En lecture">
    <header class="bar"><span></span><h2>En lecture</h2><span></span></header>
    <div class="content" id="sideBox"></div>
  </aside>
</div>

<nav class="mini" id="mini" hidden aria-label="Lecture en cours">
  <div class="mini-text"><div class="mini-t" id="miniT"></div><div class="mini-a" id="miniA"></div></div>
  <button type="button" data-c="prev" aria-label="Radio précédente"></button>
  <button type="button" data-c="play" aria-label="Lecture"></button>
  <button type="button" data-c="next" aria-label="Radio suivante"></button>
</nav>

<script>
(() => {
'use strict';
/* Dessins communs avec Ondes (ondes/ui/icons.py) : commandes aux formes arrondies */
const ICON = {
  prev: '<svg viewBox="0 0 27.27 25"><path d="M21.95 24.36L9.4 15.21A3.35 3.35 0 0 1 9.4 9.79L21.95 0.64A3.35 3.35 0 0 1 27.28 3.35L27.28 21.65A3.35 3.35 0 0 1 21.95 24.36ZM0 22.21L0 2.79A2.79 2.79 0 0 1 5.58 2.79L5.58 22.21A2.79 2.79 0 0 1 0 22.21Z"/></svg>',
  next: '<svg viewBox="0 0 27.27 25"><path d="M5.32 0.64L17.87 9.79A3.35 3.35 0 0 1 17.87 15.21L5.32 24.36A3.35 3.35 0 0 1 0 21.65L0 3.35A3.35 3.35 0 0 1 5.32 0.64ZM27.27 2.79L27.27 22.21A2.79 2.79 0 0 1 21.7 22.21L21.7 2.79A2.79 2.79 0 0 1 27.27 2.79Z"/></svg>',
  play: '<svg viewBox="0 0 24.35 25"><path d="M4.75 0.36L22.6 9.61A3.25 3.25 0 0 1 22.6 15.39L4.75 24.64A3.25 3.25 0 0 1 0 21.75L0 3.25A3.25 3.25 0 0 1 4.75 0.36Z"/></svg>',
  stop: '<svg viewBox="0 0 25 25"><path d="M3.95 0L21.05 0A3.95 3.95 0 0 1 25 3.95L25 21.05A3.95 3.95 0 0 1 21.05 25L3.95 25A3.95 3.95 0 0 1 0 21.05L0 3.95A3.95 3.95 0 0 1 3.95 0Z"/></svg>',
  spk: '<svg class="mark" viewBox="0 0 14 14"><path d="M1 5h3l4-4v12L4 9H1zM10 4.5a4 4 0 0 1 0 5l-1-1a2.6 2.6 0 0 0 0-3z"/></svg>',
  spkHi: '<svg viewBox="0 0 16 14"><path d="M1 5h3l4-4v12L4 9H1zM10 4.2a4 4 0 0 1 0 5.6l-1-1a2.6 2.6 0 0 0 0-3.6zM12.3 2a7 7 0 0 1 0 10l-1-1a5.6 5.6 0 0 0 0-8z"/></svg>',
};
const $ = id => document.getElementById(id);
const absUrl = u => new URL(u, location.href).href;
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/* ---------- Pochettes : même rendu qu'Ondes (ondes/covers.py) ----------
   carré centré, niveaux de gris, contraste rehaussé pour les images ternes,
   puis teintes de l'écran, de l'encre (noir) au fond (vert-gris). */
const INK = [28, 33, 30], BG = [201, 208, 194];
const toned = new Map();
function lcd(url, px) {
  const key = url + '@' + px;
  if (!toned.has(key)) toned.set(key, new Promise(ok => {
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
        const c = document.createElement('canvas'); c.width = c.height = px;
        const g = c.getContext('2d', { willReadFrequently: true });
        g.fillStyle = '#fff'; g.fillRect(0, 0, px, px);           // logos transparents : fond blanc
        g.imageSmoothingQuality = 'high';
        g.drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, px, px);
        const d = g.getImageData(0, 0, px, px), p = d.data, n = px * px;
        const L = new Float32Array(n), hist = new Uint32Array(1024);
        for (let i = 0; i < n; i++) {
          const v = (p[i * 4] * 0.2126 + p[i * 4 + 1] * 0.7152 + p[i * 4 + 2] * 0.0722) / 255;
          L[i] = v; hist[Math.min(1023, v * 1024 | 0)]++;
        }
        const pct = q => { let acc = 0; const lim = n * q; for (let b = 0; b < 1024; b++) { acc += hist[b]; if (acc >= lim) return b / 1023; } return 1; };
        const lo = pct(0.015), hi = pct(0.985), stretch = hi - lo > 0.12;
        for (let i = 0; i < n; i++) {
          let v = stretch ? (L[i] - lo) / (hi - lo) : L[i];
          v = Math.pow(Math.min(1, Math.max(0, v)), 0.9);
          p[i * 4] = INK[0] + (BG[0] - INK[0]) * v;
          p[i * 4 + 1] = INK[1] + (BG[1] - INK[1]) * v;
          p[i * 4 + 2] = INK[2] + (BG[2] - INK[2]) * v;
          p[i * 4 + 3] = 255;
        }
        g.putImageData(d, 0, 0);
        ok({ src: c.toDataURL('image/jpeg', 0.9), tone: true });
      } catch (e) { ok({ src: url, tone: false }); }       // image d'un autre site : simple gris
    };
    img.onerror = () => ok(null);
    img.src = url;
  }));
  return toned.get(key);
}
/* Remplit une case de pochette (vignette de liste ou grande pochette) */
function fillCover(box, logo, size) {
  const k = logo || '';
  if (box.dataset.k === k) return;
  box.dataset.k = k;
  box.classList.remove('has');
  const old = box.querySelector('img'); if (old) old.remove();
  if (!logo) return;
  const px = Math.round(size * Math.min(2, window.devicePixelRatio || 1));
  lcd(logo, px).then(res => {
    if (!res || box.dataset.k !== k) return;
    const img = el('img'); img.alt = ''; img.src = res.src;
    if (!res.tone) img.className = 'gray';
    box.prepend(img); box.classList.add('has');
  });
}

/* ---------- Radios (liste publiée dans radios.json) ---------- */
let radios = [];
const CACHE_KEY = 'ondes.radios.cache';
function quality(r) {
  const kb = parseInt(r.bitrate, 10);
  return [r.codec, kb > 0 ? kb + ' kbit/s' : ''].filter(Boolean).join(' ');
}
const place = r => [r.city, r.country].filter(Boolean).join(', ');
const subline = r => [r.country, r.city, quality(r)].filter(Boolean).join(' · ');

async function loadRadios() {
  try {
    const res = await fetch('radios.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    radios = (Array.isArray(j) ? j : j.radios || []).filter(r => r && r.url);
    META = (!Array.isArray(j) && typeof j.meta === 'string') ? j.meta.trim() : '';
    try { localStorage.setItem(CACHE_KEY + '.meta', META); } catch (e) {}
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(radios)); } catch (e) {}
  } catch (e) {
    try { radios = JSON.parse(localStorage.getItem(CACHE_KEY)) || []; } catch (e2) { radios = []; }
    try { META = localStorage.getItem(CACHE_KEY + '.meta') || ''; } catch (e3) {}
  }
  // garder la radio en cours à jour si elle a été modifiée dans le back office
  if (P.r) { const u = radios.find(r => r.url === P.r.url); if (u) P.r = u; }
  renderList();
}

/* ---------- Lecteur ---------- */
const audio = new Audio();
audio.preload = 'none';
/*
 * Reconnexion automatique
 * - P.want : tu as demandé la lecture (vrai jusqu'à ce que tu mettes pause)
 * - chien de garde : si le son ne démarre pas ou se fige, on recharge le flux
 * - essais espacés 2 s, 4 s, 8 s… jusqu'à 30 s, pendant 15 min au maximum
 * - reprise immédiate quand le téléphone signale le retour du réseau
 */
const START_TIMEOUT = 12000;   // délai max pour que le son démarre
const STALL_TIMEOUT = 8000;    // son figé depuis plus de… → on relance
const MAX_DELAY = 30000;
const GIVE_UP = 15 * 60 * 1000;
const P = {
  r: null, state: 'idle', want: false,
  base: 0, since: 0,
  retry: 0, failSince: 0, t: null, dog: null,
  lastPos: 0, lastMove: 0, reloadAt: 0,
};
const elapsed = () => P.base + (P.state === 'playing' && P.since ? Date.now() - P.since : 0);
const LABEL = {
  loading: 'Connexion…', playing: 'En direct', paused: 'En pause',
  reconnecting: 'Reconnexion…', offline: 'Hors réseau · en attente', error: 'Flux indisponible',
};
const label = s => s === 'reconnecting' && P.retry > 1 ? `Reconnexion… (essai ${P.retry})`
  : s === 'error' && P.errMsg ? P.errMsg : (LABEL[s] || '');
/* Cause de la dernière coupure, affichée sous les commandes pour comprendre ce qui se passe */
const CAUSE = { 1: 'lecture interrompue', 2: 'erreur réseau', 3: 'flux illisible (décodage)', 4: 'flux refusé par le serveur ou format non pris en charge', timeout: 'le son ne démarre pas', stall: 'le son s’est figé', ended: 'le serveur a coupé le flux', play: 'lecture refusée' };
const isOn = () => P.want;
const isBusy = s => s === 'loading' || s === 'reconnecting';

function setState(s) {
  if (P.state === 'playing' && s !== 'playing' && P.since) { P.base += Date.now() - P.since; P.since = 0; }
  P.state = s;
  if (s === 'playing' && !P.since) P.since = Date.now();
  paint();
}
function clearTimers() { clearTimeout(P.t); clearTimeout(P.dog); P.t = P.dog = null; }
function watch(ms) {                 // arme le chien de garde
  clearTimeout(P.dog);
  P.dog = setTimeout(() => { if (P.want && P.state !== 'playing') { P.lastErr = 'timeout'; reconnect(); } }, ms);
}

function load() {                    // (re)charge le flux depuis le direct
  P.reloadAt = Date.now();
  audio.src = P.r.url;
  const pr = audio.play();
  if (pr) pr.catch(err => {
    if (!err || err.name === 'AbortError') return;
    if (err.name === 'NotAllowedError') { P.want = false; clearTimers(); setState('paused'); return; }
    if (err.name === 'NotSupportedError' && !P.played && navigator.onLine !== false) {
      P.lastErr = 4;
      if (++P.refused >= 3) { refuse(); return; }
    } else P.lastErr = 'play';
    reconnect();
  });
  watch(P.played ? START_TIMEOUT : START_TIMEOUT + 8000);   // plus de patience au tout premier démarrage
}
function play(r) {
  if (!P.r || P.r.url !== r.url) { P.base = 0; P.since = 0; }
  if (!P.r || P.r.url !== r.url) P.played = false;
  P.r = r; P.want = true; P.retry = 0; P.failSince = 0; P.lastErr = null; P.errMsg = ''; P.refused = 0;
  clearTimers();
  setState('loading');
  if (T.for !== r.url) resetTrack(r.url);
  load();
  setMeta();
}

/* ---------- Titre en cours (via le relais déclaré dans radios.json) ---------- */
let META = '';
const T = { title: '', artist: '', song: '', for: '', timer: null, fails: 0, busy: false };
function resetTrack(url) {
  clearTimeout(T.timer); T.timer = null;
  T.title = T.artist = T.song = ''; T.for = url || ''; T.fails = 0;
}
function pollTrack() {
  clearTimeout(T.timer); T.timer = null;
  const r = P.r;
  if (!META || !r || !P.want || r.meta === false || T.busy) return;
  const url = r.url;
  T.busy = true;
  fetch(META + (META.includes('?') ? '&' : '?') + 'url=' + encodeURIComponent(url), { cache: 'no-store' })
    .then(res => res.ok ? res.json() : null)
    .then(j => {
      if (!P.r || P.r.url !== url) return;
      const clean = v => String(v || '').replace(/[\u0000-\u001f\u007f\u200b-\u200f\ufeff]/g, '').replace(/\s+/g, ' ').trim();
      const t0 = clean(j && j.title);
      const t = /[\p{L}\p{N}]/u.test(t0) ? t0 : '';
      if (j) { j.artist = clean(j.artist); j.song = clean(j.song); }
      T.fails = j ? 0 : T.fails + 1;
      // on ignore un « titre » qui n'est que le nom de la radio
      const useful = t && t.toLowerCase() !== P.r.name.toLowerCase();
      const next = useful ? t : '';
      if (next !== T.title) {
        T.title = next;
        T.artist = useful ? (j.artist || '') : '';
        T.song = useful ? (j.song || t) : '';
        paint(); setMeta();
      }
    })
    .catch(() => { T.fails++; })
    .finally(() => {
      T.busy = false;
      if (P.want && P.r && P.r.url === url) T.timer = setTimeout(pollTrack, T.fails > 3 ? 60000 : 20000);
    });
}
function setMeta() {
  const r = P.r;
  if (!('mediaSession' in navigator) || !r) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: T.song || r.name,
    artist: T.song ? (T.artist || r.name) : (place(r) || 'Radio'),
    album: T.song ? r.name : 'Ondes',
    artwork: r.logo
      ? [{ src: absUrl(r.logo), sizes: '300x300', type: /\.png$/i.test(r.logo) ? 'image/png' : 'image/jpeg' }]
      : [{ src: absUrl('icon-512.png'), sizes: '512x512', type: 'image/png' }],
  });
}
function reconnect(now) {
  if (!P.want || !P.r) return;
  if (!now && P.t && (P.state === 'reconnecting' || P.state === 'offline')) return; // essai déjà prévu
  clearTimers();
  if (!P.failSince) P.failSince = Date.now();
  if (Date.now() - P.failSince > GIVE_UP) {          // 15 min sans succès : on abandonne
    P.want = false; silence(); setState('error'); return;
  }
  P.retry++;
  silence();
  if (navigator.onLine === false) {                  // on attendra l'événement « online »
    setState('offline');
    P.t = setTimeout(() => { P.t = null; reconnect(); }, MAX_DELAY);  // filet de sécurité
    return;
  }
  setState('reconnecting');
  const delay = now ? 0 : Math.min(MAX_DELAY, 2000 * 2 ** (P.retry - 1));
  P.t = setTimeout(() => { P.t = null; if (P.want) load(); }, delay);
}
function refuse() {
  P.want = false; clearTimers(); silence();
  P.errMsg = 'Flux refusé ou illisible';
  setState('error');
}
function silence() {                 // coupe le téléchargement sans changer l'intention
  P.reloadAt = Date.now();
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
}
function stop() {
  if (!P.r) return;
  P.want = false;
  clearTimers();
  clearTimeout(T.timer); T.timer = null;
  silence();
  setState('paused');
}
function toggle() { if (P.r) P.want ? stop() : play(P.r); }
function step(d) {
  if (!radios.length) return;
  let i = P.r ? radios.findIndex(r => r.url === P.r.url) : -1;
  i = i < 0 ? 0 : (i + d + radios.length) % radios.length;
  play(radios[i]);
}

audio.addEventListener('playing', () => {
  if (!P.want) return;
  clearTimers();
  P.retry = 0; P.failSince = 0; P.played = true; P.lastErr = null;
  P.lastPos = audio.currentTime; P.lastMove = Date.now();
  setState('playing');
  setMeta();                         // iOS oublie parfois les infos après un rechargement du flux
  if (!T.timer && !T.busy) pollTrack();
});
audio.addEventListener('timeupdate', () => {
  if (audio.currentTime !== P.lastPos) { P.lastPos = audio.currentTime; P.lastMove = Date.now(); }
});
['waiting', 'stalled'].forEach(ev => audio.addEventListener(ev, () => {
  if (P.want && P.state === 'playing') watch(STALL_TIMEOUT);   // on laisse une chance au tampon
}));
audio.addEventListener('pause', () => {
  // pause imposée par le système (appel, écouteurs débranchés…) — pas celles de nos rechargements
  if (Date.now() - P.reloadAt < 1500 || !P.want || !audio.getAttribute('src')) return;
  stop();
});
['error', 'ended'].forEach(ev => audio.addEventListener(ev, () => {
  if (!P.want || !audio.getAttribute('src') || Date.now() - P.reloadAt <= 300) return;
  const code = ev === 'error' && audio.error ? audio.error.code : 'ended';
  P.lastErr = code;
  // Flux refusé ou format illisible dès le départ : 3 essais, puis on arrête au lieu de boucler
  if (code === 4 && !P.played && navigator.onLine !== false && ++P.refused >= 3) { refuse(); return; }
  reconnect();
}));
// Son figé sans aucun événement (cas fréquent en passant du wifi à la 4G)
setInterval(() => {
  if (P.want && P.state === 'playing' && !audio.paused && Date.now() - P.lastMove > STALL_TIMEOUT) { P.lastErr = 'stall'; reconnect(true); }
}, 2000);
window.addEventListener('online', () => { if (P.want && P.state !== 'playing') { P.retry = Math.max(0, P.retry - 1); reconnect(true); } });
window.addEventListener('offline', () => { if (P.want && P.state !== 'playing') setState('offline'); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && P.want && P.state !== 'playing' && P.state !== 'loading') reconnect(true);
});

if ('mediaSession' in navigator) {
  const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  set('play', () => P.r && play(P.r));
  set('pause', stop);
  set('stop', stop);
  set('nexttrack', () => step(1));
  set('previoustrack', () => step(-1));
}

/* ---------- Navigation ----------
   petit écran : la liste, ou « En lecture » à sa place (flèche ↖ pour revenir)
   grand écran (≥ 960 px, comme Ondes) : la liste à gauche, « En lecture » toujours à droite */
let view = 'list';
const listBox = $('listBox'), nowBox = $('nowBox'), sideBox = $('sideBox');
const backBtn = $('back'), titleEl = $('title'), stateBtn = $('state'), mini = $('mini');
const wideMQ = matchMedia('(min-width: 960px)');
const wide = () => wideMQ.matches;
let listScroll = 0;

function show(v) {
  if (v === 'now' && view !== 'now') listScroll = listBox.scrollTop;
  view = v;
  const now = v === 'now' && !wide();
  listBox.hidden = now;
  nowBox.hidden = !now;
  if (now) nowBox.scrollTop = 0; else listBox.scrollTop = listScroll;
  paint();
}
function openNow() {
  if (wide() || !P.r || view === 'now') return;
  history.pushState({ v: 'now' }, '');
  show('now');
}
function goBack() { if (view === 'now') history.back(); }
window.addEventListener('popstate', () => { if (view === 'now') show('list'); });
function onWide() { if (wide() && view === 'now') history.back(); else show(view); }
wideMQ.addEventListener ? wideMQ.addEventListener('change', onWide) : wideMQ.addListener(onWide);

/* Glisser depuis le bord gauche = retour (pratique en mode app sur iPhone) */
let edge = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  edge = view === 'now' && t.clientX < 28 ? { x: t.clientX, y: t.clientY } : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!edge) return;
  const t = e.changedTouches[0];
  if (t.clientX - edge.x > 70 && Math.abs(t.clientY - edge.y) < 60) goBack();
  edge = null;
}, { passive: true });

/* Appui : la ligne s'inverse comme sur l'écran du lecteur */
function bindPress(node, onTap) {
  let sx = 0, sy = 0;
  const off = () => node.classList.remove('press');
  node.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; node.classList.add('press'); });
  node.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) off(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => node.addEventListener(ev, off));
  node.addEventListener('click', onTap);
  node.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---------- Liste ---------- */
let rows = [];
function renderList() {
  rows = [];
  if (!radios.length) { listBox.replaceChildren(el('div', 'empty', 'Aucune radio pour le moment')); paint(); return; }
  const thumbs = radios.some(r => r.logo);
  const frag = document.createDocumentFragment();
  radios.forEach(r => {
    const row = el('div', 'row');
    let th = null;
    if (thumbs) { th = el('span', 'thumb'); row.append(th); }
    const lbl = el('span', 'lbl');
    lbl.append(el('span', 'label', r.name));
    const sub = subline(r);
    if (sub) lbl.append(el('span', 'sub', sub));
    const mark = el('span');
    row.append(lbl, mark);
    bindPress(row, () => {
      const same = P.r && P.r.url === r.url;
      if (!same || !isOn()) play(r);   // la radio en cours continue, les autres démarrent
      openNow();
    });
    frag.append(row);
    rows.push({ r, row, mark });
    if (th) fillCover(th, r.logo, 44);
  });
  listBox.replaceChildren(frag);
  paint();
}

/* ---------- En lecture (même composition que la page d'Ondes) ---------- */
function makeNow(container) {
  const n = el('div', 'now');
  n.innerHTML = `
    <div class="coverwrap"><div class="cover"><span class="ph">${ICON.spkHi}</span></div></div>
    <div class="side">
      <div class="meta"><i class="gap"></i><div class="kind"></div><div class="t"><span></span></div><div class="a"></div><div class="al"></div><i class="gap end"></i></div>
      <div class="live"><div class="st"></div><div class="why"></div></div>
      <div class="ctrls">
        <button type="button" data-c="prev" aria-label="Radio précédente">${ICON.prev}</button>
        <button type="button" data-c="play" aria-label="Lecture"></button>
        <button type="button" data-c="next" aria-label="Radio suivante">${ICON.next}</button>
      </div>
    </div>`;
  container.replaceChildren(n);
  const q = s => n.querySelector(s);
  const v = {
    cover: q('.cover'), kind: q('.kind'), t: q('.t'), ts: q('.t span'), a: q('.a'), al: q('.al'),
    live: q('.live'), st: q('.live .st'), why: q('.live .why'),
    prev: q('[data-c=prev]'), mid: q('[data-c=play]'), next: q('[data-c=next]'), shown: null,
  };
  q('.ctrls').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) transport(b.dataset.c); });
  return v;
}
const nowViews = [makeNow(nowBox), makeNow(sideBox)];

function transport(c) {
  if (c === 'prev') step(-1);
  else if (c === 'next') step(1);
  else if (P.r) toggle();
  else if (radios[0]) play(radios[0]);
}
const songText = () => T.title ? (T.artist ? T.artist + ' — ' + T.song : T.song) : '';
const liveText = s => s === 'playing' ? 'En direct · ' + fmt(elapsed()) : label(s);
function causeText(r, s) {
  if (s === 'error' && /^http:/i.test(r.url) && location.protocol === 'https:')
    return 'Ce flux est en http : le navigateur peut le bloquer sur une page https.';
  if ((s === 'reconnecting' || s === 'error') && P.lastErr != null && CAUSE[P.lastErr])
    return 'Cause : ' + CAUSE[P.lastErr] + (typeof P.lastErr === 'number' ? ` (code ${P.lastErr})` : '');
  return '';
}

function updateNow(v) {
  const r = P.r, s = P.state, on = isOn();
  const i = r ? radios.findIndex(x => x.url === r.url) : -1;
  v.kind.textContent = r ? (i >= 0 ? `${i + 1} sur ${radios.length}` : 'Radio') : '';
  const title = r ? r.name : 'Rien en lecture';
  v.t.classList.toggle('idle', !r);
  if (v.shown !== title) {                      // nom trop long : il défile, comme sur Ondes
    v.shown = title;
    v.ts.textContent = title;
    v.t.classList.remove('scroll');
    requestAnimationFrame(() => {
      if (v.ts.offsetWidth > v.t.clientWidth) {
        v.t.style.setProperty('--dur', `${Math.max(8, title.length / 3)}s`);
        v.t.classList.add('scroll');
      }
    });
  }
  v.a.textContent = r ? songText() : '';
  v.al.textContent = r ? [place(r), quality(r)].filter(Boolean).join(' · ') : '';
  fillCover(v.cover, r && r.logo, 300);
  v.live.hidden = !r;
  v.live.classList.toggle('busy', isBusy(s) || s === 'offline');
  if (r) { v.st.textContent = liveText(s); v.why.textContent = causeText(r, s); }
  const icon = on ? 'stop' : 'play';
  if (v.mid.dataset.icon !== icon) { v.mid.dataset.icon = icon; v.mid.innerHTML = ICON[icon]; }
  v.mid.setAttribute('aria-label', on ? 'Arrêter' : 'Lecture');
  v.prev.disabled = v.next.disabled = radios.length < 2;
}

/* ---------- Mini-lecteur ---------- */
mini.querySelector('[data-c=prev]').innerHTML = ICON.prev;
mini.querySelector('[data-c=next]').innerHTML = ICON.next;
mini.addEventListener('click', e => {
  const b = e.target.closest('button[data-c]');
  if (b) { if (!b.disabled) transport(b.dataset.c); } else openNow();
});
function updateMini() {
  const r = P.r, s = P.state;
  const visible = !!r && !wide() && view === 'list';
  mini.hidden = !visible;
  document.body.classList.toggle('with-mini', visible);
  if (!visible) return;
  // comme sur Ondes : le morceau s'il est annoncé, sinon le nom de la radio
  $('miniT').textContent = T.title ? T.song : r.name;
  $('miniA').textContent = T.title ? [T.artist, r.name].filter(Boolean).join(' · ') : liveText(s);
  const b = mini.querySelector('[data-c=play]'), icon = isOn() ? 'stop' : 'play';
  if (b.dataset.icon !== icon) { b.dataset.icon = icon; b.innerHTML = ICON[icon]; }
  mini.querySelectorAll('[data-c=prev],[data-c=next]').forEach(x => { x.disabled = radios.length < 2; });
}

function paint() {
  const r = P.r, s = P.state, on = isOn();
  for (const { r: x, row, mark } of rows) {
    const cur = !!r && r.url === x.url && on;
    row.classList.toggle('busy', cur && isBusy(s));
    if (cur !== (mark.dataset.on === '1')) { mark.dataset.on = cur ? '1' : ''; mark.innerHTML = cur ? ICON.spk : ''; }
  }
  const nowNarrow = view === 'now' && !wide();
  titleEl.textContent = nowNarrow ? 'En lecture' : 'Ondes';
  backBtn.classList.toggle('off', !nowNarrow);
  const st = !!r && !wide() && view === 'list';
  stateBtn.innerHTML = st ? ICON.spkHi : '';
  stateBtn.disabled = !st;
  nowViews.forEach(updateNow);
  updateMini();
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = on ? 'playing' : (r ? 'paused' : 'none');
}
const fmt = ms => {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
};
setInterval(() => {
  if (!P.r || P.state !== 'playing') return;
  nowViews.forEach(v => { v.st.textContent = liveText(P.state); });
  if (!mini.hidden && !T.title) $('miniA').textContent = liveText(P.state);
}, 1000);

bindPress(backBtn, goBack);
stateBtn.addEventListener('click', openNow);

/* Clavier (ordinateur) : espace = lecture/arrêt, flèches = radio précédente/suivante, Échap = retour */
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); transport('play'); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Escape') goBack();
});

/* Liste à jour quand on revient sur l'app (si tu as modifié radios.json entre-temps) */
document.addEventListener('visibilitychange', () => { if (!document.hidden && !isOn()) loadRadios(); });

history.replaceState({ v: 'list' }, '');
loadRadios();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
