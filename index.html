<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e9e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ondes">
<title>Ondes Radio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --lcd:#e6e9e3; --ink:#1c211e; --mute:#5f6862; --line:#c3c8c0;
  --row:66px; --head:46px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--lcd);color:var(--ink)}
body{
  font:600 17px/1.25 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased;
}
#app{
  display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

/* En-tête */
header{
  flex:none;height:var(--head);display:grid;grid-template-columns:52px 1fr 52px;align-items:center;
  border-bottom:1.5px solid var(--ink);background:linear-gradient(#eef0ec,var(--lcd));
}
header h1{font-size:17px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{height:100%;width:52px;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer}
header button svg{width:22px;height:22px}

/* Écrans */
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
.view.in-fwd{animation:inFwd .22s ease-out}
.view.in-back{animation:inBack .22s ease-out}
@keyframes inFwd{from{transform:translateX(38%);opacity:0}to{transform:none;opacity:1}}
@keyframes inBack{from{transform:translateX(-38%);opacity:0}to{transform:none;opacity:1}}
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:12px}

/* Pochettes */
.cover{flex:none;width:46px;height:46px;border-radius:4px;object-fit:cover;filter:grayscale(1) contrast(1.08);background:#d3d7d0;box-shadow:inset 0 0 0 1px rgba(28,33,30,.18);display:grid;place-items:center;color:var(--mute);overflow:hidden}
.cover svg{width:22px;height:22px}
img.cover{box-shadow:none;border:1px solid rgba(28,33,30,.18)}

/* Liste */
.list{list-style:none}
.list li{min-height:var(--row);display:flex;align-items:center;gap:14px;padding:9px 16px 9px 12px;cursor:pointer}
.list .lbl{flex:1;min-width:0;display:flex;flex-direction:column}
.list .t,.list .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .s{font-size:13px;font-weight:500;color:var(--mute);margin-top:3px}
.list .r{flex:none;width:18px;height:18px}
.list .r svg{width:18px;height:18px;display:block}
.list li.press,.list li.cur{background:var(--ink);color:var(--lcd)}
.list li.press .s,.list li.cur .s{color:inherit;opacity:.72}
.list li.cur img.cover{border-color:rgba(230,233,227,.35)}
.list li.cur span.cover{background:#3a413c;color:var(--lcd)}
.list li.loading .r svg{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.msg{padding:48px 20px;text-align:center;color:var(--mute);font-weight:500}

/* Barre de direct (commune) */
.track{border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--ink)}
.playing .track i{width:100%}
.loading .track i,.reconnecting .track i{
  width:100%;background:repeating-linear-gradient(-45deg,var(--ink) 0 5px,transparent 5px 10px);
  background-size:14.14px 100%;animation:barber .7s linear infinite;
}
@keyframes barber{to{background-position:14.14px 0}}
.times{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}

/* Mini-lecteur (liste uniquement) */
#mini{
  flex:none;display:none;align-items:center;gap:12px;cursor:pointer;
  border-top:1.5px solid var(--ink);background:linear-gradient(var(--lcd),#dde1da);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
}
#mini.on{display:flex}
#mini.press{background:#d6dad3}
#mCover{flex:none;display:flex}
#mini .cover{width:52px;height:52px}
#mini .cover svg{width:24px;height:24px}
#mini .txt{flex:1;min-width:0}
#mini .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .track{height:7px;margin:7px 0 5px}
.round{
  flex:none;border-radius:50%;border:2px solid var(--ink);background:none;color:var(--ink);
  display:grid;place-items:center;cursor:pointer;
}
.round.press,.plain.press{background:var(--ink);color:var(--lcd)}
#mToggle{width:52px;height:52px}
#mToggle svg{width:22px;height:22px}

/* En lecture */
#np{
  overflow-y:auto;align-items:center;text-align:center;
  padding:16px 24px calc(22px + env(safe-area-inset-bottom));
}
#np .count{font-size:14px;font-weight:600;color:var(--mute)}
#nCover{display:flex;margin:16px 0 20px}
#np .cover{
  width:min(72vw,40vh,320px);height:min(72vw,40vh,320px);border-radius:6px;
  box-shadow:0 1px 0 rgba(28,33,30,.08);
}
#np span.cover{box-shadow:inset 0 0 0 1px rgba(28,33,30,.18)}
#np span.cover svg{width:34%;height:34%}
#np .name{font-size:24px;font-weight:700;line-height:1.15;word-break:break-word}
#np .place{font-size:16px;font-weight:500;color:var(--mute);margin-top:6px}
#np .qual{font-size:13px;font-weight:600;color:var(--mute);margin-top:4px;letter-spacing:.02em}
#np .bar{width:100%;margin-top:auto;padding-top:22px}
#np .track{height:11px;margin-bottom:7px}
#np .ctl{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:22px}
.plain{width:60px;height:60px;border-radius:50%;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.plain svg{width:28px;height:28px}
.plain:disabled{opacity:.25;cursor:default}
#nToggle{width:80px;height:80px}
#nToggle svg{width:32px;height:32px}
#np .note{margin-top:16px;font-size:13px;font-weight:500;color:var(--mute);line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="back" aria-label="Retour" style="visibility:hidden"></button>
    <h1 id="title">Ondes</h1>
    <span></span>
  </header>

  <!-- Liste des radios -->
  <section class="view on" id="vList">
    <main id="main"><div class="msg">Chargement…</div></main>
    <div id="mini" aria-live="polite">
      <span id="mCover"></span>
      <div class="txt">
        <div class="name" id="mName"></div>
        <div class="track"><i></i></div>
        <div class="times"><span id="mStat"></span><span id="mTime"></span></div>
      </div>
      <button id="mToggle" class="round" aria-label="Lecture"></button>
    </div>
  </section>

  <!-- En lecture -->
  <section class="view" id="np">
    <div class="count" id="nCount"></div>
    <span id="nCover"></span>
    <div class="name" id="nName"></div>
    <div class="place" id="nPlace"></div>
    <div class="qual" id="nQual"></div>
    <div class="bar" id="nBar">
      <div class="track"><i></i></div>
      <div class="times"><span id="nTime"></span><span id="nStat"></span></div>
    </div>
    <div class="ctl">
      <button id="nPrev" class="plain" aria-label="Radio précédente"></button>
      <button id="nToggle" class="round" aria-label="Lecture"></button>
      <button id="nNext" class="plain" aria-label="Radio suivante"></button>
    </div>
    <div class="note" id="nNote"></div>
  </section>
</div>

<script>
(() => {
'use strict';
const ICON = {
  back: '<svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7.5 4.5v15l12-7.5z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></svg>',
  prev: '<svg viewBox="0 0 24 24"><path d="M4 5h2.5v14H4zM20 5v14l-6-7zM14 5v14l-7-7z" fill="currentColor"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M17.5 5H20v14h-2.5zM4 5v14l6-7zM10 5v14l7-7z" fill="currentColor"/></svg>',
  speaker: '<svg viewBox="0 0 24 24"><path d="M3.5 9h4l5-4v14l-5-4h-4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  waves: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
};
const $ = id => document.getElementById(id);
const absUrl = u => new URL(u, location.href).href;

/* Pochette en niveaux de gris ; à défaut, un pictogramme d'ondes */
function cover(logo) {
  const ph = () => { const s = document.createElement('span'); s.className = 'cover'; s.innerHTML = ICON.waves; return s; };
  if (!logo) return ph();
  const img = new Image();
  img.className = 'cover'; img.alt = ''; img.decoding = 'async'; img.src = logo;
  img.onerror = () => img.replaceWith(ph());
  return img;
}
function setCover(slot, logo) {
  const k = logo || '-';
  if (slot.dataset.k === k) return;
  slot.dataset.k = k;
  slot.replaceChildren(cover(logo));
}

/* ---------- Radios (gérées depuis le back office) ---------- */
let radios = [];
const CACHE_KEY = 'ondes.radios.cache';
function quality(r) {
  const kb = parseInt(r.bitrate, 10);
  return [r.codec, kb > 0 ? kb + ' kbit/s' : ''].filter(Boolean).join(' ');
}
const place = r => [r.city, r.country].filter(Boolean).join(', ');
const subline = r => [r.country, r.city, quality(r)].filter(Boolean).join(' · ');

async function loadRadios() {
  try {
    const res = await fetch('radios.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    radios = (Array.isArray(j) ? j : j.radios || []).filter(r => r && r.url);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(radios)); } catch (e) {}
  } catch (e) {
    try { radios = JSON.parse(localStorage.getItem(CACHE_KEY)) || []; } catch (e2) { radios = []; }
  }
  // garder la radio en cours à jour si elle a été modifiée dans le back office
  if (P.r) { const u = radios.find(r => r.url === P.r.url); if (u) P.r = u; }
  renderList();
}

/* ---------- Lecteur ---------- */
const audio = new Audio();
audio.preload = 'none';
/*
 * Reconnexion automatique
 * - P.want : tu as demandé la lecture (vrai jusqu'à ce que tu mettes pause)
 * - chien de garde : si le son ne démarre pas ou se fige, on recharge le flux
 * - essais espacés 2 s, 4 s, 8 s… jusqu'à 30 s, pendant 15 min au maximum
 * - reprise immédiate quand le téléphone signale le retour du réseau
 */
const START_TIMEOUT = 12000;   // délai max pour que le son démarre
const STALL_TIMEOUT = 8000;    // son figé depuis plus de… → on relance
const MAX_DELAY = 30000;
const GIVE_UP = 15 * 60 * 1000;
const P = {
  r: null, state: 'idle', want: false,
  base: 0, since: 0,
  retry: 0, failSince: 0, t: null, dog: null,
  lastPos: 0, lastMove: 0, reloadAt: 0,
};
const elapsed = () => P.base + (P.state === 'playing' && P.since ? Date.now() - P.since : 0);
const LABEL = {
  loading: 'Connexion…', playing: 'En direct', paused: 'En pause',
  reconnecting: 'Reconnexion…', offline: 'Hors réseau · en attente', error: 'Flux indisponible',
};
const label = s => s === 'reconnecting' && P.retry > 1 ? `Reconnexion… (essai ${P.retry})` : (LABEL[s] || '');
const isOn = () => P.want;
const isBusy = s => s === 'loading' || s === 'reconnecting';

function setState(s) {
  if (P.state === 'playing' && s !== 'playing' && P.since) { P.base += Date.now() - P.since; P.since = 0; }
  P.state = s;
  if (s === 'playing' && !P.since) P.since = Date.now();
  paint();
}
function clearTimers() { clearTimeout(P.t); clearTimeout(P.dog); P.t = P.dog = null; }
function watch(ms) {                 // arme le chien de garde
  clearTimeout(P.dog);
  P.dog = setTimeout(() => { if (P.want && P.state !== 'playing') reconnect(); }, ms);
}

function load() {                    // (re)charge le flux depuis le direct
  P.reloadAt = Date.now();
  audio.src = P.r.url;
  const pr = audio.play();
  if (pr) pr.catch(err => {
    if (!err || err.name === 'AbortError') return;
    if (err.name === 'NotAllowedError') { P.want = false; clearTimers(); setState('paused'); return; }
    reconnect();
  });
  watch(START_TIMEOUT);
}
function play(r) {
  if (!P.r || P.r.url !== r.url) { P.base = 0; P.since = 0; }
  P.r = r; P.want = true; P.retry = 0; P.failSince = 0;
  clearTimers();
  setState('loading');
  load();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: r.name, artist: place(r) || 'Radio', album: 'Ondes',
      artwork: r.logo
        ? [{ src: absUrl(r.logo), sizes: '300x300', type: 'image/jpeg' }]
        : [{ src: absUrl('icons/icon-512.png'), sizes: '512x512', type: 'image/png' }],
    });
  }
}
function reconnect(now) {
  if (!P.want || !P.r) return;
  if (!now && P.t && (P.state === 'reconnecting' || P.state === 'offline')) return; // essai déjà prévu
  clearTimers();
  if (!P.failSince) P.failSince = Date.now();
  if (Date.now() - P.failSince > GIVE_UP) {          // 15 min sans succès : on abandonne
    P.want = false; silence(); setState('error'); return;
  }
  P.retry++;
  silence();
  if (navigator.onLine === false) {                  // on attendra l'événement « online »
    setState('offline');
    P.t = setTimeout(() => { P.t = null; reconnect(); }, MAX_DELAY);  // filet de sécurité
    return;
  }
  setState('reconnecting');
  const delay = now ? 0 : Math.min(MAX_DELAY, 2000 * 2 ** (P.retry - 1));
  P.t = setTimeout(() => { P.t = null; if (P.want) load(); }, delay);
}
function silence() {                 // coupe le téléchargement sans changer l'intention
  P.reloadAt = Date.now();
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
}
function stop() {
  if (!P.r) return;
  P.want = false;
  clearTimers();
  silence();
  setState('paused');
}
function toggle() { if (P.r) P.want ? stop() : play(P.r); }
function step(d) {
  if (!radios.length) return;
  let i = P.r ? radios.findIndex(r => r.url === P.r.url) : -1;
  i = i < 0 ? 0 : (i + d + radios.length) % radios.length;
  play(radios[i]);
}

audio.addEventListener('playing', () => {
  if (!P.want) return;
  clearTimers();
  P.retry = 0; P.failSince = 0;
  P.lastPos = audio.currentTime; P.lastMove = Date.now();
  setState('playing');
});
audio.addEventListener('timeupdate', () => {
  if (audio.currentTime !== P.lastPos) { P.lastPos = audio.currentTime; P.lastMove = Date.now(); }
});
['waiting', 'stalled'].forEach(ev => audio.addEventListener(ev, () => {
  if (P.want && P.state === 'playing') watch(STALL_TIMEOUT);   // on laisse une chance au tampon
}));
audio.addEventListener('pause', () => {
  // pause imposée par le système (appel, écouteurs débranchés…) — pas celles de nos rechargements
  if (Date.now() - P.reloadAt < 1500 || !P.want || !audio.getAttribute('src')) return;
  stop();
});
['error', 'ended'].forEach(ev => audio.addEventListener(ev, () => {
  if (P.want && audio.getAttribute('src') && Date.now() - P.reloadAt > 300) reconnect();
}));
// Son figé sans aucun événement (cas fréquent en passant du wifi à la 4G)
setInterval(() => {
  if (P.want && P.state === 'playing' && !audio.paused && Date.now() - P.lastMove > STALL_TIMEOUT) reconnect(true);
}, 2000);
window.addEventListener('online', () => { if (P.want && P.state !== 'playing') { P.retry = Math.max(0, P.retry - 1); reconnect(true); } });
window.addEventListener('offline', () => { if (P.want && P.state !== 'playing') setState('offline'); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && P.want && P.state !== 'playing' && P.state !== 'loading') reconnect(true);
});

if ('mediaSession' in navigator) {
  const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  set('play', () => P.r && play(P.r));
  set('pause', stop);
  set('stop', stop);
  set('nexttrack', () => step(1));
  set('previoustrack', () => step(-1));
}

/* ---------- Navigation : liste ⇄ en lecture ---------- */
let view = 'list';
const vList = $('vList'), vNp = $('np'), backBtn = $('back'), titleEl = $('title');
backBtn.innerHTML = ICON.back;

function show(v, dir) {
  view = v;
  const el = v === 'np' ? vNp : vList, other = v === 'np' ? vList : vNp;
  other.classList.remove('on', 'in-fwd', 'in-back');
  el.classList.remove('in-fwd', 'in-back');
  el.classList.add('on');
  if (dir) { void el.offsetWidth; el.classList.add(dir === 'fwd' ? 'in-fwd' : 'in-back'); }
  titleEl.textContent = v === 'np' ? 'En lecture' : 'Ondes';
  backBtn.style.visibility = v === 'np' ? 'visible' : 'hidden';
  paint();
}
function openNp() {
  if (!P.r || view === 'np') return;
  history.pushState({ v: 'np' }, '');
  show('np', 'fwd');
}
function goBack() { if (view === 'np') history.back(); }
window.addEventListener('popstate', () => { if (view === 'np') show('list', 'back'); });

/* Glisser depuis le bord gauche = retour (pratique en mode app sur iPhone) */
let edge = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  edge = view === 'np' && t.clientX < 28 ? { x: t.clientX, y: t.clientY } : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!edge) return;
  const t = e.changedTouches[0];
  if (t.clientX - edge.x > 70 && Math.abs(t.clientY - edge.y) < 60) goBack();
  edge = null;
}, { passive: true });

/* ---------- Affichage ---------- */
function bindPress(el, onTap) {
  let sx = 0, sy = 0;
  const off = () => el.classList.remove('press');
  el.addEventListener('pointerdown', e => { if (el.disabled) return; sx = e.clientX; sy = e.clientY; el.classList.add('press'); });
  el.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) off(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, off));
  el.addEventListener('click', e => { e.stopPropagation(); onTap(e); });
  el.addEventListener('contextmenu', e => e.preventDefault());
}

const main = $('main');
let rows = [];
function renderList() {
  main.replaceChildren();
  rows = [];
  if (!radios.length) { main.innerHTML = '<div class="msg">Aucune radio pour le moment</div>'; paint(); return; }
  const ul = document.createElement('ul');
  ul.className = 'list';
  radios.forEach(r => {
    const li = document.createElement('li');
    const lbl = document.createElement('span'); lbl.className = 'lbl';
    const t = document.createElement('span'); t.className = 't'; t.textContent = r.name;
    lbl.append(t);
    const sub = subline(r);
    if (sub) { const s = document.createElement('span'); s.className = 's'; s.textContent = sub; lbl.append(s); }
    const ic = document.createElement('span'); ic.className = 'r';
    li.append(cover(r.logo), lbl, ic);
    bindPress(li, () => {
      const same = P.r && P.r.url === r.url;
      if (!same || !isOn()) play(r);   // la radio en cours continue, les autres démarrent
      openNp();
    });
    ul.append(li);
    rows.push({ r, li, ic });
  });
  main.append(ul);
  paint();
}

const mini = $('mini'), mToggle = $('mToggle'), nToggle = $('nToggle'), nPrev = $('nPrev'), nNext = $('nNext');
nPrev.innerHTML = ICON.prev; nNext.innerHTML = ICON.next;

function paint() {
  const on = isOn(), r = P.r, s = P.state;
  // liste
  for (const { r: x, li, ic } of rows) {
    const cur = !!r && r.url === x.url;
    li.classList.toggle('cur', cur);
    li.classList.toggle('loading', cur && isBusy(s));
    ic.innerHTML = cur ? (on ? ICON.speaker : ICON.pause) : '';
  }
  // mini-lecteur : seulement sur la liste
  mini.className = r && view === 'list' ? 'on ' + s : '';
  if (r) {
    setCover($('mCover'), r.logo);
    $('mName').textContent = r.name;
    $('mStat').textContent = label(s);
    mToggle.innerHTML = on ? ICON.pause : ICON.play;
    mToggle.setAttribute('aria-label', on ? 'Pause' : 'Lecture');
  }
  // écran de lecture
  if (r) {
    const i = radios.findIndex(x => x.url === r.url);
    $('nCount').textContent = i >= 0 ? `${i + 1} sur ${radios.length}` : '';
    setCover($('nCover'), r.logo);
    $('nName').textContent = r.name;
    $('nPlace').textContent = place(r);
    $('nQual').textContent = quality(r);
    $('nBar').className = 'bar ' + s;
    $('nStat').textContent = label(s);
    nToggle.innerHTML = on ? ICON.pause : ICON.play;
    nToggle.setAttribute('aria-label', on ? 'Pause' : 'Lecture');
    nPrev.disabled = nNext.disabled = radios.length < 2;
    $('nNote').textContent = s === 'error' && /^http:/i.test(r.url) && location.protocol === 'https:'
      ? 'Ce flux est en http : le navigateur peut le bloquer sur une page https.' : '';
  }
  tick();
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = on ? 'playing' : (r ? 'paused' : 'none');
}
const fmt = ms => {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
};
function tick() { if (P.r) { const t = fmt(elapsed()); $('mTime').textContent = t; $('nTime').textContent = t; } }
setInterval(tick, 1000);

bindPress(mini, openNp);
bindPress(mToggle, toggle);
bindPress(nToggle, toggle);
bindPress(nPrev, () => step(-1));
bindPress(nNext, () => step(1));
bindPress(backBtn, goBack);

/* Liste à jour quand on revient sur l'app (si tu as modifié le back office entre-temps) */
document.addEventListener('visibilitychange', () => { if (!document.hidden && !isOn()) loadRadios(); });

history.replaceState({ v: 'list' }, '');
loadRadios();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
